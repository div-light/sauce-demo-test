[project]
name = "sauce-demo-test"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "playwright>=1.65.0",
    "pytest>=9.2.0",
    "pytest-playwright>=0.10.0",
    "pytest-xdist>=3.8.0",
    "python-dotenv>=1.2.4",
    "ruff>=0.17.5",
]

[project.scripts]
sauce-demo-test = "sauce_demo_test:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.5",
]

[tool.uv]
package = false
